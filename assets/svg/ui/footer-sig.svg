<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
      .bg { fill: #0a0812; }
      .sig-text {
        font-family:'Share Tech Mono','Courier New',Courier,monospace;
        font-size: 11px;
        fill: rgba(0,255,255,0.3);
        letter-spacing: 0.25em;
        animation: sig-pulse 6s ease-in-out infinite;
      }
      .sig-line {
        stroke: rgba(0,255,255,0.12);
        stroke-width: 1;
      }
      .bracket {
        stroke: rgba(138,43,226,0.4);
        stroke-width: 1.5;
        fill: none;
      }
      @keyframes sig-pulse {
        0%,100% { opacity: 0.3; }
        50%      { opacity: 0.7; }
      }
    </style>
  </defs>
  <rect class="bg" width="900" height="60"/>
  <line class="sig-line" x1="0" y1="1" x2="900" y2="1"/>

  <!-- Corner brackets bottom -->
  <polyline class="bracket" points="20,54 20,58 32,58"/>
  <polyline class="bracket" points="868,58 880,58 880,54"/>

  <text class="sig-text" x="450" y="36" text-anchor="middle">
    // Built with precision. No tracking. No ads. — Noor AlHussain
  </text>
</svg>
