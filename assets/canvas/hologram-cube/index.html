<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hologram Cube — NoorHack</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#0a0812; overflow:hidden; }
    canvas { display:block; }
    @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms!important;transition-duration:0.01ms!important;} }
    :focus-visible{outline:2px solid #00ffff;outline-offset:2px;}
    #label {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      font-family:'Share Tech Mono',monospace; font-size:11px;
      color:rgba(0,255,255,0.55); letter-spacing:0.3em; pointer-events:none;
    }
    #badge{position:fixed;top:16px;right:20px;font-family:'Share Tech Mono',monospace;
      font-size:9px;color:rgba(0,255,255,0.55);letter-spacing:.2em;
      border:1px solid rgba(0,255,255,0.1);padding:4px 10px;}
    #back {
      position:fixed; top:16px; left:20px;
      font-family:'Share Tech Mono',monospace; font-size:11px;
      color:rgba(0,255,255,0.55); letter-spacing:0.2em;
      text-decoration:none; border:1px solid rgba(0,255,255,0.4); padding:6px 12px;
    }
    #back:hover { color:#00ffff; border-color:rgba(0,255,255,0.6); }
    #fallback{display:none;position:fixed;inset:0;background:#0a0812;z-index:5;
      align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;
      font-family:'Share Tech Mono',monospace;padding:0 20px;}
    #fallback p{color:rgba(0,255,255,0.6);letter-spacing:.1em;font-size:12px;max-width:480px;line-height:1.6;}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
</head>
<body>
  <a id="back" href="../../../README.md">&#x2190; BACK</a>
  <div id="badge">THREE.JS — CSS3D HYBRID</div>
  <div id="label">// HOLOGRAPHIC HUD CUBE — IDENTITY PROJECTION</div>
  <div id="fallback">
    <p>This scene needs WebGL, which isn't available in this browser or has been disabled.<br/>
    Try a recent Chrome, Edge, Firefox, or Safari with hardware acceleration enabled.</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    } catch (e) {
      document.getElementById('fallback').style.display = 'flex';
      throw new Error('WebGL unavailable for hologram-cube: ' + e.message);
    }
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label',
      'Interactive holographic HUD cube — a rotating wireframe cube with scanline-lit faces, corner brackets, a particle halo, and floating identity labels, rendered with Three.js and CSS3D');
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.3, 0.5, 0.8);
    composer.addPass(bloom);

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.05;
    controls.autoRotate     = !reduceMotion;
    controls.autoRotateSpeed= 0.8;

    // ── Hologram cube faces ────────────────────────────────────────────
    const CUBE_SIZE = 4;

    // Wireframe edges
    const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE));
    const edgeMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying float vY;
        void main() {
          vY = position.y;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying float vY;
        void main() {
          // Scanline interference on edges
          float scan = 0.6 + 0.4 * sin(vY * 12.0 + uTime * 4.0);
          vec3 col = mix(vec3(0.0, 1.0, 1.0), vec3(0.54, 0.17, 0.89), scan);
          float flicker = 0.85 + 0.15 * sin(uTime * 8.3 + vY * 3.0);
          gl_FragColor = vec4(col, flicker * 0.9);
        }
      `,
      transparent: true,
      linewidth: 2,
    });
    const edges = new THREE.LineSegments(edgeGeo, edgeMat);
    scene.add(edges);

    // Transparent faces
    const faceMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vPos;
        varying vec3 vNormal;
        void main() {
          vPos    = position;
          vNormal = normal;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vPos;
        varying vec3 vNormal;
        void main() {
          // Scanlines
          float scan  = step(0.5, fract(vPos.y * 6.0 + uTime * 0.8));
          // Rim glow
          float rim   = 1.0 - abs(dot(normalize(vNormal), vec3(0,0,1)));
          float alpha = 0.04 + rim * 0.08 + scan * 0.02;
          float flicker = 0.7 + 0.3 * sin(uTime * 6.0);
          vec3 col = vec3(0.0, 1.0, 1.0);
          gl_FragColor = vec4(col, alpha * flicker);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE), faceMat);
    scene.add(cube);

    // ── Corner bracket decorations ─────────────────────────────────────
    function corner(x, y, z) {
      const L = 0.5, s = Math.sign;
      const pts = [
        [x + s(x)*L, y,          z         ],
        [x,          y,          z         ],
        [x,          y + s(y)*L, z         ],
        [x,          y,          z         ],
        [x,          y,          z + s(z)*L],
      ];
      const geo = new THREE.BufferGeometry().setFromPoints(
        pts.map(p => new THREE.Vector3(...p))
      );
      const mat = new THREE.LineBasicMaterial({ color: 0x8a2be2, transparent: true, opacity: 0.8 });
      scene.add(new THREE.Line(geo, mat));
    }
    const h = CUBE_SIZE / 2;
    for (const x of [-h, h]) for (const y of [-h, h]) for (const z of [-h, h]) corner(x,y,z);

    // ── Floating data labels (CSS3D) ───────────────────────────────────
    const cssRenderer = new CSS3DRenderer();
    cssRenderer.setSize(innerWidth, innerHeight);
    cssRenderer.domElement.style.position = 'absolute';
    cssRenderer.domElement.style.top = '0';
    cssRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(cssRenderer.domElement);

    const labels = [
      { text: 'OPERATOR: Noor AlHussain',    pos: [0,  1.2, 2.1] },
      { text: 'HANDLE  : @NoorHack',         pos: [0,  0.4, 2.1] },
      { text: 'LOCATION: Republic of Iraq',  pos: [0, -0.4, 2.1] },
      { text: 'STACK   : Silicon -> AI',     pos: [0, -1.2, 2.1] },
    ];

    labels.forEach(l => {
      const div = document.createElement('div');
      div.style.cssText = `
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        color: rgba(0,255,255,0.85);
        letter-spacing: 0.12em;
        white-space: nowrap;
        text-shadow: 0 0 8px rgba(0,255,255,0.6);
      `;
      div.textContent = l.text;
      const obj = new CSS3DObject(div);
      obj.position.set(...l.pos);
      obj.scale.set(0.014, 0.014, 0.014);
      scene.add(obj);
    });

    // ── Particle halo ──────────────────────────────────────────────────
    const haloCount = 3000;
    const hPos = new Float32Array(haloCount * 3);
    for (let i = 0; i < haloCount; i++) {
      const r = CUBE_SIZE * 1.2 + Math.random() * CUBE_SIZE;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2*Math.random()-1);
      hPos[i*3]   = r * Math.sin(p) * Math.cos(t);
      hPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
      hPos[i*3+2] = r * Math.cos(p);
    }
    const hGeo = new THREE.BufferGeometry();
    hGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
    scene.add(new THREE.Points(hGeo,
      new THREE.PointsMaterial({ color:0x00ffff, size:0.04, transparent:true, opacity:0.3, depthWrite:false })
    ));

    // ── Stars ──────────────────────────────────────────────────────────
    const sPos = new Float32Array(2000*3);
    for (let i=0;i<sPos.length;i++) sPos[i]=(Math.random()-0.5)*300;
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
    scene.add(new THREE.Points(sGeo,
      new THREE.PointsMaterial({color:0xffffff,size:0.05,transparent:true,opacity:0.2})
    ));

    // ── Animate ────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = reduceMotion ? 0 : clock.getElapsedTime();
      edgeMat.uniforms.uTime.value  = t;
      faceMat.uniforms.uTime.value  = t;
      controls.update();
      composer.render();
      cssRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      cssRenderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
