<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <metadata>
  <!-- CLASSIFIED Channel: Decode to access — 6e6f6f726861636b2e776f726b40676d61696c2e636f6d -->
</metadata>
<defs>
    <style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
      </style>
  </defs>
  <foreignObject width="900" height="280">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        .sig {
          width: 900px;
          height: 280px;
          background: #0a0812;
          border: 1px solid rgba(0,255,255,0.15);
          font-family:'Share Tech Mono','Courier New',Courier,monospace;
          overflow: hidden;
          display: flex;
          position: relative;
        }

        /* Left — sonar panel */
        .sonar-panel {
          width: 220px;
          min-width: 220px;
          border-right: 1px solid rgba(0,255,255,0.1);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          padding: 16px 0;
        }
        .sonar-label {
          font-size: 9px;
          color: rgba(0,255,255,0.35);
          letter-spacing: 0.3em;
          margin-bottom: 12px;
        }
        .sonar-svg {
          width: 140px;
          height: 140px;
          position: relative;
        }
        .sonar-status {
          font-size: 10px;
          color: #00ff41;
          letter-spacing: 0.2em;
          margin-top: 12px;
          animation: blink 1.4s step-end infinite;
        }

        /* Right — channel list */
        .channels-panel {
          flex: 1;
          padding: 20px 24px;
          display: flex;
          flex-direction: column;
          gap: 0;
        }
        .panel-header {
          font-size: 10px;
          color: rgba(0,255,255,0.35);
          letter-spacing: 0.35em;
          border-bottom: 1px solid rgba(0,255,255,0.1);
          padding-bottom: 8px;
          margin-bottom: 14px;
        }

        .channel {
          display: flex;
          align-items: center;
          gap: 0;
          padding: 9px 0;
          border-bottom: 1px solid rgba(0,255,255,0.05);
          opacity: 0;
          animation: chan-appear 0.3s ease forwards;
        }
        .c1 { animation-delay: 0.3s; }
        .c2 { animation-delay: 0.7s; }
        .c3 { animation-delay: 1.1s; }
        .c4 { animation-delay: 1.5s; }
        .c5 { animation-delay: 1.9s; }

        .chan-id {
          font-size: 10px;
          color: rgba(0,255,255,0.3);
          letter-spacing: 0.15em;
          width: 70px;
        }
        .chan-name {
          font-size: 13px;
          color: rgba(232,232,240,0.85);
          letter-spacing: 0.1em;
          flex: 1;
        }
        .chan-addr {
          font-size: 11px;
          color: rgba(0,255,255,0.55);
          letter-spacing: 0.08em;
          flex: 1;
        }
        .chan-status {
          font-size: 10px;
          letter-spacing: 0.2em;
          padding: 2px 10px;
          border: 1px solid;
          min-width: 80px;
          text-align: center;
        }
        .active {
          color: #00ff41;
          border-color: rgba(0,255,65,0.4);
          background: rgba(0,255,65,0.05);
        }
        .classified {
          color: #ff003c;
          border-color: rgba(255,0,60,0.4);
          background: rgba(255,0,60,0.05);
          animation: blink 1.6s step-end infinite;
        }

        .chan-icon {
          width: 20px;
          font-size: 14px;
          margin-right: 10px;
        }

        /* Sonar rings animation */
        .ring { fill: none; stroke: rgba(0,255,255,0.15); }
        .ring-pulse {
          fill: none;
          stroke: rgba(0,255,255,0.7);
          stroke-width: 1.5;
          animation: sonar-expand 3s ease-out infinite;
          transform-origin: 70px 70px;
        }
        .ring-pulse-2 {
          fill: none;
          stroke: rgba(0,255,255,0.5);
          stroke-width: 1;
          animation: sonar-expand 3s 1s ease-out infinite;
          transform-origin: 70px 70px;
        }
        .ring-pulse-3 {
          fill: none;
          stroke: rgba(0,255,255,0.3);
          stroke-width: 1;
          animation: sonar-expand 3s 2s ease-out infinite;
          transform-origin: 70px 70px;
        }
        .center-dot { fill: #00ffff; animation: center-pulse 2s ease-in-out infinite; }
        .crosshair { stroke: rgba(0,255,255,0.2); stroke-width: 0.8; }

        @keyframes sonar-expand {
          0%   { stroke-width: 2; opacity: 1; transform: scale(0.1); }
          100% { stroke-width: 0; opacity: 0; transform: scale(1);   }
        }
        @keyframes center-pulse {
          0%,100% { r: 4; opacity: 1;   fill: #00ffff; }
          50%      { r: 6; opacity: 0.7; fill: #ffffff; }
        }
        @keyframes blink {
          0%,100% { opacity: 1; }
          50%      { opacity: 0; }
        }
        @keyframes chan-appear {
          to { opacity: 1; }
        }
      </style>

      <div class="sig">
        <!-- Sonar panel -->
        <div class="sonar-panel">
          <div class="sonar-label">SIGNAL INTERCEPT</div>
          <svg class="sonar-svg" viewBox="0 0 140 140">
            <!-- Static rings -->
            <circle class="ring" cx="70" cy="70" r="20" stroke-width="0.8"/>
            <circle class="ring" cx="70" cy="70" r="38" stroke-width="0.8"/>
            <circle class="ring" cx="70" cy="70" r="56" stroke-width="0.8"/>
            <!-- Crosshairs -->
            <line class="crosshair" x1="70" y1="10" x2="70" y2="130"/>
            <line class="crosshair" x1="10" y1="70" x2="130" y2="70"/>
            <!-- Animated pulse rings -->
            <circle class="ring-pulse"   cx="70" cy="70" r="56"/>
            <circle class="ring-pulse-2" cx="70" cy="70" r="56"/>
            <circle class="ring-pulse-3" cx="70" cy="70" r="56"/>
            <!-- Center dot -->
            <circle class="center-dot" cx="70" cy="70" r="4"/>
            <!-- Blip targets -->
            <circle cx="94" cy="48" r="3" fill="rgba(0,255,65,0.8)"/>
            <circle cx="45" cy="88" r="2" fill="rgba(0,255,65,0.5)"/>
          </svg>
          <div class="sonar-status">SCANNING...</div>
        </div>

        <!-- Channels panel -->
        <div class="channels-panel">
          <div class="panel-header">// OPEN CHANNELS — NOOR ALHUSSAIN</div>

          <div class="channel c1">
            <span class="chan-id">CH-01</span>
            <span class="chan-name">GitHub</span>
            <span class="chan-addr">github.com/Noor-AlHussain</span>
            <span class="chan-status active">ACTIVE</span>
          </div>

          <div class="channel c2">
            <span class="chan-id">CH-02</span>
            <span class="chan-name">X / Twitter</span>
            <span class="chan-addr">x.com/NoorHack</span>
            <span class="chan-status active">ACTIVE</span>
          </div>

          <div class="channel c3">
            <span class="chan-id">CH-03</span>
            <span class="chan-name">LinkedIn</span>
            <span class="chan-addr">linkedin.com/in/Noor-AlHussain</span>
            <span class="chan-status active">ACTIVE</span>
          </div>

          <div class="channel c4">
            <span class="chan-id">CH-04</span>
            <span class="chan-name">Email</span>
            <span class="chan-addr">noorhack.work@gmail.com</span>
            <span class="chan-status active">ACTIVE</span>
          </div>

          <div class="channel c5">
            <span class="chan-id">CH-05</span>
            <span class="chan-name">CLASSIFIED</span>
            <span class="chan-addr">— ENCRYPTED —</span>
            <span class="chan-status classified">RESTRICTED</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
