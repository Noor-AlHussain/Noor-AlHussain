<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <defs>
    <style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  /* The reveal-highlight washes and the four traveling connector pulses
     use SMIL (animate/animateMotion), a separate animation system the
     block above cannot reach — hidden outright under reduced motion
     instead. Every layer box, border, dot marker, and label is plain,
     non-animated content and stays fully visible either way. */
  @media (prefers-reduced-motion: reduce) {
    .reduced-motion-hide { display: none; }
  }
      .bg { fill: #0a0812; }
      .layer-box   { rx:4; fill: rgba(10,8,18,0.9); }
      .layer-border{ fill:none; stroke-width:1.5; rx:4; }
      .layer-num   { font-family:'Share Tech Mono','Courier New',Courier,monospace; font-size:10px; fill:rgba(232,232,240,0.25); letter-spacing:.1em; }
      .layer-label { font-family:'Share Tech Mono','Courier New',Courier,monospace; font-size:13px; letter-spacing:.22em; dominant-baseline:middle; }
      .layer-desc  { font-family:'Share Tech Mono','Courier New',Courier,monospace; font-size:9.5px; fill:rgba(232,232,240,0.38); letter-spacing:.1em; }
      .title       { font-family:Orbitron,Impact,'Arial Narrow',Arial,sans-serif; font-size:11px; fill:rgba(0,255,255,0.32); letter-spacing:.4em; }

      /* Reveal from left with clip-path */
      .reveal-0 { animation: reveal-slide 8s 0.0s ease-in-out infinite; }
      .reveal-1 { animation: reveal-slide 8s 1.2s ease-in-out infinite; }
      .reveal-2 { animation: reveal-slide 8s 2.4s ease-in-out infinite; }
      .reveal-3 { animation: reveal-slide 8s 3.6s ease-in-out infinite; }
      .reveal-4 { animation: reveal-slide 8s 4.8s ease-in-out infinite; }

      /* Border glow */
      .b0 { animation: border-glow 8s 0.0s ease-in-out infinite; stroke:#ff003c; }
      .b1 { animation: border-glow 8s 1.2s ease-in-out infinite; stroke:#ff6600; }
      .b2 { animation: border-glow 8s 2.4s ease-in-out infinite; stroke:#00ffff; }
      .b3 { animation: border-glow 8s 3.6s ease-in-out infinite; stroke:#8a2be2; }
      .b4 { animation: border-glow 8s 4.8s ease-in-out infinite; stroke:#00ff41; }

      /* Label color */
      .t0 { fill:#ff003c; animation: text-glow 8s 0.0s ease-in-out infinite; }
      .t1 { fill:#ff6600; animation: text-glow 8s 1.2s ease-in-out infinite; }
      .t2 { fill:#00ffff; animation: text-glow 8s 2.4s ease-in-out infinite; }
      .t3 { fill:#8a2be2; animation: text-glow 8s 3.6s ease-in-out infinite; }
      .t4 { fill:#00ff41; animation: text-glow 8s 4.8s ease-in-out infinite; }

      /* Indicator dot */
      .dot { rx:4; }
      .dot0 { fill:#ff003c; animation: dot-pulse 8s 0.0s ease-in-out infinite; }
      .dot1 { fill:#ff6600; animation: dot-pulse 8s 1.2s ease-in-out infinite; }
      .dot2 { fill:#00ffff; animation: dot-pulse 8s 2.4s ease-in-out infinite; }
      .dot3 { fill:#8a2be2; animation: dot-pulse 8s 3.6s ease-in-out infinite; }
      .dot4 { fill:#00ff41; animation: dot-pulse 8s 4.8s ease-in-out infinite; }

      /* Traveling arrow between layers */
      .travel-dot { fill:#00ffff; opacity:0; }

      @keyframes reveal-slide {
        0%,11%  { opacity:.22; }
        14%,30% { opacity:1; }
        34%,100%{ opacity:.22; }
      }
      @keyframes border-glow {
        0%,11%  { opacity:.12; filter:none; }
        14%,30% { opacity:1;   filter:drop-shadow(0 0 6px currentColor); }
        34%,100%{ opacity:.12; filter:none; }
      }
      @keyframes text-glow {
        0%,11%  { opacity:.3; }
        14%,30% { opacity:1; }
        34%,100%{ opacity:.3; }
      }
      @keyframes dot-pulse {
        0%,11%  { opacity:.25; transform:scale(1); }
        14%,30% { opacity:1;   transform:scale(1.4); }
        34%,100%{ opacity:.25; transform:scale(1); }
      }
    </style>

    <marker id="arr" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="rgba(0,255,255,0.3)"/>
    </marker>

    <!-- Clip IDs for each layer reveal -->
    <clipPath id="clip-0"><rect x="56" y="50"  width="0" height="48" rx="4">
      <animate attributeName="width" values="0;0;788;788;0" dur="8s" begin="0s"
               keyTimes="0;0.11;0.14;0.34;1" calcMode="spline"
               keySplines="0 0 0.2 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip-1"><rect x="76" y="106" width="0" height="48" rx="4">
      <animate attributeName="width" values="0;0;748;748;0" dur="8s" begin="1.2s"
               keyTimes="0;0.11;0.14;0.34;1" calcMode="spline"
               keySplines="0 0 0.2 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip-2"><rect x="96" y="162" width="0" height="48" rx="4">
      <animate attributeName="width" values="0;0;708;708;0" dur="8s" begin="2.4s"
               keyTimes="0;0.11;0.14;0.34;1" calcMode="spline"
               keySplines="0 0 0.2 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip-3"><rect x="116" y="218" width="0" height="48" rx="4">
      <animate attributeName="width" values="0;0;668;668;0" dur="8s" begin="3.6s"
               keyTimes="0;0.11;0.14;0.34;1" calcMode="spline"
               keySplines="0 0 0.2 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip-4"><rect x="136" y="274" width="0" height="32" rx="4">
      <animate attributeName="width" values="0;0;628;628;0" dur="8s" begin="4.8s"
               keyTimes="0;0.11;0.14;0.34;1" calcMode="spline"
               keySplines="0 0 0.2 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect class="bg" width="900" height="330"/>

  <!-- Title -->
  <text class="title" x="450" y="28" text-anchor="middle">// ABSTRACTION LAYER STACK</text>

  <!-- ── LAYER 0 — HARDWARE ── -->
  <rect class="layer-box reveal-0"  x="56"  y="50"  width="788" height="48" rx="4"/>
  <rect class="layer-border b0"     x="56"  y="50"  width="788" height="48" rx="4"/>
  <!-- Reveal highlight -->
  <rect x="56" y="50" width="788" height="48" rx="4"
        fill="rgba(255,0,60,0.04)" clip-path="url(#clip-0)" class="reduced-motion-hide"/>
  <circle class="dot0" cx="88" cy="74" r="5" style="transform-origin:88px 74px"/>
  <text class="layer-num" x="106" y="67">LAYER 0</text>
  <text class="layer-label t0" x="106" y="80">HARDWARE &amp; PHYSICAL ATTACKS</text>
  <text class="layer-desc" x="550" y="80">transistors / silicon / side-channel / fault injection</text>

  <!-- Arrow 0→1 + traveling dot -->
  <line x1="450" y1="98" x2="450" y2="106" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle r="3" fill="#ff003c" opacity="0.7" class="reduced-motion-hide">
    <animateMotion path="M 450,98 L 450,106" dur="0.8s" begin="1.0s" repeatCount="indefinite" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="1.0s" repeatCount="indefinite"/>
  </circle>

  <!-- ── LAYER 1 — FIRMWARE ── -->
  <rect class="layer-box reveal-1"  x="76"  y="106" width="748" height="48" rx="4"/>
  <rect class="layer-border b1"     x="76"  y="106" width="748" height="48" rx="4"/>
  <rect x="76" y="106" width="748" height="48" rx="4"
        fill="rgba(255,102,0,0.04)" clip-path="url(#clip-1)" class="reduced-motion-hide"/>
  <circle class="dot1" cx="108" cy="130" r="5" style="transform-origin:108px 130px"/>
  <text class="layer-num" x="126" y="122">LAYER 1</text>
  <text class="layer-label t1" x="126" y="136">FIRMWARE &amp; EMBEDDED SYSTEMS</text>
  <text class="layer-desc" x="550" y="136">UEFI / bootloader / MCU / JTAG / SWD</text>

  <line x1="450" y1="154" x2="450" y2="162" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle r="3" fill="#ff6600" opacity="0.7" class="reduced-motion-hide">
    <animateMotion path="M 450,154 L 450,162" dur="0.8s" begin="2.2s" repeatCount="indefinite" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── LAYER 2 — OS / KERNEL ── -->
  <rect class="layer-box reveal-2"  x="96"  y="162" width="708" height="48" rx="4"/>
  <rect class="layer-border b2"     x="96"  y="162" width="708" height="48" rx="4"/>
  <rect x="96" y="162" width="708" height="48" rx="4"
        fill="rgba(0,255,255,0.04)" clip-path="url(#clip-2)" class="reduced-motion-hide"/>
  <circle class="dot2" cx="128" cy="186" r="5" style="transform-origin:128px 186px"/>
  <text class="layer-num" x="146" y="178">LAYER 2</text>
  <text class="layer-label t2" x="146" y="192">OS / KERNEL DEVELOPMENT</text>
  <text class="layer-desc" x="540" y="192">syscalls / drivers / memory mgmt / scheduler</text>

  <line x1="450" y1="210" x2="450" y2="218" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle r="3" fill="#00ffff" opacity="0.7" class="reduced-motion-hide">
    <animateMotion path="M 450,210 L 450,218" dur="0.8s" begin="3.4s" repeatCount="indefinite" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ── LAYER 3 — SECURITY ── -->
  <rect class="layer-box reveal-3"  x="116" y="218" width="668" height="48" rx="4"/>
  <rect class="layer-border b3"     x="116" y="218" width="668" height="48" rx="4"/>
  <rect x="116" y="218" width="668" height="48" rx="4"
        fill="rgba(138,43,226,0.04)" clip-path="url(#clip-3)" class="reduced-motion-hide"/>
  <circle class="dot3" cx="148" cy="242" r="5" style="transform-origin:148px 242px"/>
  <text class="layer-num" x="166" y="234">LAYER 3</text>
  <text class="layer-label t3" x="166" y="248">SECURITY &amp; EXPLOITATION</text>
  <text class="layer-desc" x="530" y="248">pwn / RE / vuln research / exploit dev</text>

  <line x1="450" y1="266" x2="450" y2="274" stroke="rgba(0,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle r="3" fill="#8a2be2" opacity="0.7" class="reduced-motion-hide">
    <animateMotion path="M 450,266 L 450,274" dur="0.8s" begin="4.6s" repeatCount="indefinite" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="4.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ── LAYER 4 — AI / SOFTWARE ── -->
  <rect class="layer-box reveal-4"  x="136" y="274" width="628" height="32" rx="4"/>
  <rect class="layer-border b4"     x="136" y="274" width="628" height="32" rx="4"/>
  <rect x="136" y="274" width="628" height="32" rx="4"
        fill="rgba(0,255,65,0.04)" clip-path="url(#clip-4)" class="reduced-motion-hide"/>
  <circle class="dot4" cx="168" cy="290" r="5" style="transform-origin:168px 290px"/>
  <text class="layer-num" x="186" y="284">LAYER 4</text>
  <text class="layer-label t4" x="186" y="296" style="font-size:12px">AI &amp; SOFTWARE SYSTEMS</text>
  <text class="layer-desc" x="530" y="296">ML / inference / compilers / lang design</text>
</svg>
