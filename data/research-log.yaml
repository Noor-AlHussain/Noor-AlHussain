  # ── Note on CTFtime integration (researched, not built) ────────────────
  # CTFtime's public API only exposes TOP TEAM rankings — there is no
  # official endpoint for a single team's writeups or event history, so a
  # "live CTFtime feed" isn't something the API actually supports beyond a
  # basic team-ranking badge. If you have a registered CTFtime team, add a
  # manual `ctf` entry per event above instead of expecting an automated
  # feed — the API doesn't provide the data an automated feed would need.
