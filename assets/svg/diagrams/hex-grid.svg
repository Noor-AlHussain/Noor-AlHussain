<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
      .bg { fill: #0a0812; }
      .hex {
        fill: none;
        stroke-width: 1;
        animation: hex-pulse 4s ease-in-out infinite;
      }
      /* Staggered delays for random-feel pulse */
      .h00 { stroke:#00ffff; animation-delay:0.0s; }
      .h01 { stroke:#8a2be2; animation-delay:0.3s; }
      .h02 { stroke:#00ffff; animation-delay:0.7s; }
      .h03 { stroke:#00ff41; animation-delay:1.1s; }
      .h04 { stroke:#00ffff; animation-delay:0.5s; }
      .h05 { stroke:#8a2be2; animation-delay:1.4s; }
      .h06 { stroke:#ff6600; animation-delay:0.2s; }
      .h07 { stroke:#00ffff; animation-delay:0.9s; }
      .h08 { stroke:#8a2be2; animation-delay:1.7s; }
      .h09 { stroke:#00ffff; animation-delay:0.4s; }
      .h10 { stroke:#00ff41; animation-delay:0.8s; }
      .h11 { stroke:#00ffff; animation-delay:1.2s; }
      .h12 { stroke:#8a2be2; animation-delay:0.1s; }
      .h13 { stroke:#ff003c; animation-delay:1.5s; }
      .h14 { stroke:#00ffff; animation-delay:0.6s; }
      .h15 { stroke:#8a2be2; animation-delay:1.0s; }
      .h16 { stroke:#00ffff; animation-delay:1.8s; }
      .h17 { stroke:#00ff41; animation-delay:0.35s;}
      .h18 { stroke:#00ffff; animation-delay:0.75s;}
      .h19 { stroke:#8a2be2; animation-delay:1.25s;}
      .h20 { stroke:#ff6600; animation-delay:1.6s; }
      .h21 { stroke:#00ffff; animation-delay:0.15s;}
      .h22 { stroke:#8a2be2; animation-delay:0.55s;}
      .h23 { stroke:#00ff41; animation-delay:0.95s;}
      .h24 { stroke:#00ffff; animation-delay:1.35s;}

      @keyframes hex-pulse {
        0%,100% { opacity: 0.06; }
        50%      { opacity: 0.35; }
      }
    </style>
  </defs>

  <rect class="bg" width="900" height="160"/>

  <!--
    Hexagons: flat-top orientation
    Size r=28, center-to-center: w=r*sqrt(3)≈48.5, h=r*1.5=42
    Rows and columns of hexagons tiling the 900x160 area
    hex points for flat-top size 28:
      (cx+28,cy), (cx+14,cy+24), (cx-14,cy+24),
      (cx-28,cy), (cx-14,cy-24), (cx+14,cy-24)
  -->

  <!-- Row 0 -->
  <polygon class="hex h00" points="85,80 71,104 43,104 29,80 43,56 71,56"/>
  <polygon class="hex h01" points="134,52 120,76 92,76 78,52 92,28 120,28"/>
  <polygon class="hex h02" points="183,80 169,104 141,104 127,80 141,56 169,56"/>
  <polygon class="hex h03" points="232,52 218,76 190,76 176,52 190,28 218,28"/>
  <polygon class="hex h04" points="281,80 267,104 239,104 225,80 239,56 267,56"/>
  <polygon class="hex h05" points="330,52 316,76 288,76 274,52 288,28 316,28"/>
  <polygon class="hex h06" points="379,80 365,104 337,104 323,80 337,56 365,56"/>
  <polygon class="hex h07" points="428,52 414,76 386,76 372,52 386,28 414,28"/>
  <polygon class="hex h08" points="477,80 463,104 435,104 421,80 435,56 463,56"/>
  <polygon class="hex h09" points="526,52 512,76 484,76 470,52 484,28 512,28"/>
  <polygon class="hex h10" points="575,80 561,104 533,104 519,80 533,56 561,56"/>
  <polygon class="hex h11" points="624,52 610,76 582,76 568,52 582,28 610,28"/>
  <polygon class="hex h12" points="673,80 659,104 631,104 617,80 631,56 659,56"/>
  <polygon class="hex h13" points="722,52 708,76 680,76 666,52 680,28 708,28"/>
  <polygon class="hex h14" points="771,80 757,104 729,104 715,80 729,56 757,56"/>
  <polygon class="hex h15" points="820,52 806,76 778,76 764,52 778,28 806,28"/>
  <polygon class="hex h16" points="869,80 855,104 827,104 813,80 827,56 855,56"/>

  <!-- Row 1 (offset) -->
  <polygon class="hex h17" points="109,128 95,152 67,152 53,128 67,104 95,104"/>
  <polygon class="hex h18" points="158,100 144,124 116,124 102,100 116,76 144,76"/>
  <polygon class="hex h19" points="207,128 193,152 165,152 151,128 165,104 193,104"/>
  <polygon class="hex h20" points="256,100 242,124 214,124 200,100 214,76 242,76"/>
  <polygon class="hex h21" points="305,128 291,152 263,152 249,128 263,104 291,104"/>
  <polygon class="hex h22" points="354,100 340,124 312,124 298,100 312,76 340,76"/>
  <polygon class="hex h23" points="403,128 389,152 361,152 347,128 361,104 389,104"/>
  <polygon class="hex h24" points="452,100 438,124 410,124 396,100 410,76 438,76"/>

  <!-- Fade edges -->
  <defs>
    <linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0a0812" stop-opacity="1"/>
      <stop offset="15%" stop-color="#0a0812" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="85%" stop-color="#0a0812" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0812" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="900" height="160" fill="url(#fade-l)"/>
  <rect width="900" height="160" fill="url(#fade-r)"/>
</svg>
