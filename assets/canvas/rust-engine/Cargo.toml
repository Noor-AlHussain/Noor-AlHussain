[package]
name = "void-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["Noor AlHussain <noorhack.work@gmail.com>"]
description = "Custom voxel-sphere renderer — Rust + wgpu, compiled to WebAssembly."
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu         = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "webgl"] }
bytemuck     = { version = "1.14", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys       = "0.3"
console_error_panic_hook = "0.1"
log          = "0.4"
console_log  = "1.0"
glam         = "0.34"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Window", "Element", "HtmlCanvasElement", "MediaQueryList", "Node",
]

[profile.release]
opt-level = "s"
lto       = true
panic     = "abort"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
