version: 2
updates:
  # npm dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm)"
    ignore:
      # Three.js — pin to r158 until all scenes are audited against API changes
      - dependency-name: "three"
        update-types: ["version-update:semver-major","version-update:semver-minor"]

  # Cargo (Rust void-engine)
  - package-ecosystem: "cargo"
    directory: "/assets/canvas/rust-engine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      # glam 0.34.1 no longer has Mat4::perspective_rh or Mat4::look_at_rh (the
      # projection and look-at constructors moved into its camera module), so a
      # bump needs a code migration in src/math.rs, not just a lockfile change.
      # Dependabot's PR for it failed check-rust with two E0599 errors. Patch
      # releases still come through; remove this once math.rs is migrated.
      - dependency-name: "glam"
        update-types: ["version-update:semver-major","version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
