      <stop offset="100%" stop-color="#0a0812"/>
    </radialGradient>
    <filter id="og-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#00ffff" opacity="0.4"/>
  <rect x="0" y="628" width="1200" height="2" fill="#00ffff" opacity="0.4"/>

  <!-- Corner brackets -->
  <polyline points="40,40 40,80 80,80" fill="none" stroke="#8a2be2" stroke-width="2" opacity="0.6"/>
  <polyline points="1160,40 1160,80 1120,80" fill="none" stroke="#8a2be2" stroke-width="2" opacity="0.6"/>
  <polyline points="40,590 40,550 80,550" fill="none" stroke="#8a2be2" stroke-width="2" opacity="0.6"/>
