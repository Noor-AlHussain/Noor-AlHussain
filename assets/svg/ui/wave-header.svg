<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a0812"/>
      <stop offset="50%"  stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      .wave1 { animation: wave-drift 12s ease-in-out infinite; }
      .wave2 { animation: wave-drift 16s ease-in-out infinite reverse; }
      @keyframes wave-drift {
        0%,100% { transform: translateX(0) translateY(0); }
        50%      { transform: translateX(-20px) translateY(4px); }
      }
    </style>
  </defs>
  <rect width="900" height="100" fill="url(#wave-grad)"/>
  <path class="wave1" d="M0,60 C150,90 300,30 450,60 C600,90 750,30 900,60 L900,100 L0,100 Z"
        fill="rgba(0,255,255,0.06)"/>
  <path class="wave2" d="M0,70 C200,40 400,95 600,65 C750,45 850,75 900,68 L900,100 L0,100 Z"
        fill="rgba(138,43,226,0.05)"/>
  <line x1="0" y1="99" x2="900" y2="99" stroke="rgba(0,255,255,0.15)" stroke-width="1"/>
</svg>
