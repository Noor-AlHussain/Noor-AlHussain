<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32">
  <defs>
    <style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
      .bg    { fill: #0a0812; }
      .border{ fill: none; stroke: rgba(0,255,65,0.4); stroke-width: 1; }
      .label { font-family:'Share Tech Mono','Courier New',Courier,monospace; font-size:11px; fill:rgba(0,255,65,0.9); letter-spacing:0.2em; }
      .dot-outer { fill: rgba(0,255,65,0.2); animation: ring-expand 2s ease-out infinite; transform-origin: 20px 16px; }
      .dot-inner { fill: #00ff41; animation: dot-pulse 2s ease-in-out infinite; transform-origin: 20px 16px; }
      @keyframes ring-expand {
        0%   { transform: scale(1);   opacity: 0.7; }
        100% { transform: scale(2.2); opacity: 0;   }
      }
      @keyframes dot-pulse {
        0%,100% { transform: scale(1);    opacity: 1;   }
        50%      { transform: scale(0.85); opacity: 0.7; }
      }
    </style>
    <filter id="dot-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect class="bg" width="160" height="32" rx="2"/>
  <rect class="border" x="0.5" y="0.5" width="159" height="31" rx="2"/>
  <circle class="dot-outer" cx="20" cy="16" r="6" filter="url(#dot-glow)"/>
  <circle class="dot-inner" cx="20" cy="16" r="4" filter="url(#dot-glow)"/>
  <text class="label" x="36" y="21">STATUS: ONLINE</text>
</svg>
